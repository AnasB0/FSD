openapi: 3.0.3
info:
  title: Najah Delivery API
  description: Express API service for Najah Delivery OS - providing comprehensive delivery management endpoints
  version: 1.0.0
  contact:
    name: Najah Delivery Support
    email: support@najahdelivery.com

servers:
  - url: http://localhost:3000/api/v1
    description: Development server
  - url: https://api.najahdelivery.com/v1
    description: Production server

tags:
  - name: Health
    description: Service health and status
  - name: Authentication
    description: User authentication and authorization
  - name: Merchants
    description: Merchant management
  - name: Orders
    description: Order management and tracking
  - name: Couriers
    description: Courier management
  - name: Route Plans
    description: Route planning and optimization
  - name: Tracking
    description: Real-time order tracking
  - name: Assistant
    description: AI assistant integration

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
        requestId:
          type: string

    Merchant:
      type: object
      required:
        - name
        - email
        - phone
        - address
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        businessType:
          type: string
          enum: [restaurant, retail, pharmacy, grocery, other]
        address:
          type: object
          properties:
            ar:
              type: string
            en:
              type: string
            location:
              type: object
              properties:
                type:
                  type: string
                  enum: [Point]
                coordinates:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
        status:
          type: string
          enum: [active, inactive, suspended]

    Order:
      type: object
      required:
        - merchantId
        - orderNumber
        - items
        - address
        - customer
        - pricing
      properties:
        _id:
          type: string
        merchantId:
          type: string
        orderNumber:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: number
              price:
                type: number
        address:
          type: object
          properties:
            ar:
              type: string
            en:
              type: string
            location:
              type: object
        customer:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: string
        status:
          type: string
          enum: [pending, confirmed, assigned, picked_up, in_transit, delivered, cancelled, failed]
        courierId:
          type: string

    Courier:
      type: object
      required:
        - name
        - email
        - phone
        - vehicle
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        vehicle:
          type: object
          properties:
            type:
              type: string
              enum: [bicycle, motorcycle, car, van]
        status:
          type: string
          enum: [available, busy, offline, on_break]
        location:
          type: object
          properties:
            type:
              type: string
              enum: [Point]
            coordinates:
              type: array
              items:
                type: number

    RoutePlan:
      type: object
      required:
        - courierId
        - orders
      properties:
        _id:
          type: string
        courierId:
          type: string
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, planned, in_progress, completed, cancelled]
        orders:
          type: array
          items:
            type: object
            properties:
              orderId:
                type: string
              sequence:
                type: number
              estimatedArrival:
                type: string
                format: date-time

paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health status
      description: Returns the health status of the API service
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  uptime:
                    type: number
                  database:
                    type: object
        '503':
          description: Service is unhealthy

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
        '401':
          description: Invalid credentials

  /merchants:
    get:
      tags:
        - Merchants
      summary: List merchants
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, suspended]
      responses:
        '200':
          description: List of merchants
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Merchant'
                  totalPages:
                    type: integer
                  currentPage:
                    type: integer
                  total:
                    type: integer

    post:
      tags:
        - Merchants
      summary: Create merchant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Merchant'
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'

  /merchants/{id}:
    get:
      tags:
        - Merchants
      summary: Get merchant by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Merchant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '404':
          description: Merchant not found

  /orders:
    get:
      tags:
        - Orders
      summary: List orders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

    post:
      tags:
        - Orders
      summary: Create order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created

  /orders/{id}/normalize:
    post:
      tags:
        - Orders
      summary: Normalize order address
      description: Geocode and normalize the order delivery address
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address normalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{id}/plan:
    post:
      tags:
        - Orders
      summary: Create route plan for order
      description: Call optimizer service to create optimized route
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                courierId:
                  type: string
                constraints:
                  type: object
      responses:
        '200':
          description: Route plan created

  /couriers:
    get:
      tags:
        - Couriers
      summary: List couriers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of couriers
          content:
            application/json:
              schema:
                type: object
                properties:
                  couriers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Courier'

    post:
      tags:
        - Couriers
      summary: Create courier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Courier'
      responses:
        '201':
          description: Courier created

  /couriers/{id}/assign-route:
    post:
      tags:
        - Couriers
      summary: Assign route to courier
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                routePlanId:
                  type: string
      responses:
        '200':
          description: Route assigned

  /route-plans:
    get:
      tags:
        - Route Plans
      summary: List route plans
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of route plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  routePlans:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoutePlan'

    post:
      tags:
        - Route Plans
      summary: Create route plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePlan'
      responses:
        '201':
          description: Route plan created

  /tracking/update:
    post:
      tags:
        - Tracking
      summary: Update order tracking
      description: Update order and courier location/status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - courierId
                - location
              properties:
                orderId:
                  type: string
                courierId:
                  type: string
                location:
                  type: object
                  properties:
                    coordinates:
                      type: array
                      items:
                        type: number
                status:
                  type: string
      responses:
        '200':
          description: Tracking updated

  /tracking/{orderId}:
    get:
      tags:
        - Tracking
      summary: Get order tracking info
      description: Public endpoint to track order status
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tracking information

  /assistant/query:
    post:
      tags:
        - Assistant
      summary: Query AI assistant
      description: Send query to AI assistant service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                context:
                  type: object
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  suggestions:
                    type: array
