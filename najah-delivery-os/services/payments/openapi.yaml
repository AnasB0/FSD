openapi: 3.0.3
info:
  title: Najah Delivery OS - Payments Service API
  description: |
    Payment processing service for Najah Delivery OS platform.
    Handles payment intents, confirmations, cancellations, and reconciliation.
    
    **STUB Implementation**: This is a stub service that simulates payment flows
    without actual payment gateway integration. In production, integrate with
    real gateways (MADA/Hyperpay, STC Pay, etc.).
    
    Supported payment methods:
    - MADA (Saudi debit cards)
    - STC_PAY (STC Pay digital wallet)
    - COD (Cash on Delivery)
    - APPLE_PAY
    - CREDIT_CARD
  version: 1.0.0
  contact:
    name: Najah Delivery Team
    email: dev@najahdelivery.com

servers:
  - url: http://localhost:3003
    description: Local development
  - url: https://api.najahdelivery.com
    description: Production

tags:
  - name: Health
    description: Health check endpoints
  - name: Payments
    description: Payment intent operations
  - name: Webhooks
    description: Payment gateway webhook callbacks
  - name: Reconciliation
    description: Payment reconciliation for accounting

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns service health status and database connection
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: Service is unhealthy

  /api/payments/intents:
    post:
      tags:
        - Payments
      summary: Create payment intent
      description: Creates a new payment intent for an order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntent'
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/payments/intents/{id}:
    get:
      tags:
        - Payments
      summary: Get payment intent
      description: Retrieves details of a specific payment intent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntentId'
      responses:
        '200':
          description: Payment intent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/intents/{id}/confirm:
    post:
      tags:
        - Payments
      summary: Confirm payment
      description: Confirms a pending payment intent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPayment'
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/intents/{id}/cancel:
    post:
      tags:
        - Payments
      summary: Cancel payment
      description: Cancels a payment intent or refunds a confirmed payment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPayment'
      responses:
        '200':
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/webhook:
    post:
      tags:
        - Webhooks
      summary: Payment gateway webhook
      description: Receives webhook callbacks from payment gateways
      parameters:
        - name: x-webhook-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-webhook-timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Webhook processed
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/payments/reconcile:
    get:
      tags:
        - Reconciliation
      summary: Reconciliation report
      description: Generates payment reconciliation report for accounting
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: merchantId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationReport'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IntentId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Payment intent ID

  schemas:
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
        service:
          type: string
        version:
          type: string
        uptime:
          type: number
        database:
          type: string
          enum: [connected, disconnected]

    PaymentMethod:
      type: string
      enum: [MADA, STC_PAY, COD, APPLE_PAY, CREDIT_CARD]

    PaymentStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, FAILED, REFUNDED]

    CreatePaymentIntent:
      type: object
      required:
        - orderId
        - merchantId
        - amount
        - method
        - customerPhone
      properties:
        orderId:
          type: string
        merchantId:
          type: string
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          default: SAR
          enum: [SAR]
        method:
          $ref: '#/components/schemas/PaymentMethod'
        customerPhone:
          type: string
        customerEmail:
          type: string
          format: email
        metadata:
          type: object

    ConfirmPayment:
      type: object
      properties:
        gatewayTransactionId:
          type: string
        collectedAmount:
          type: number
        metadata:
          type: object

    CancelPayment:
      type: object
      properties:
        reason:
          type: string

    PaymentIntentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            intentId:
              type: string
            orderId:
              type: string
            merchantId:
              type: string
            amount:
              type: number
            currency:
              type: string
            method:
              $ref: '#/components/schemas/PaymentMethod'
            status:
              $ref: '#/components/schemas/PaymentStatus'
            paymentUrl:
              type: string
            expiresAt:
              type: string
              format: date-time
            metadata:
              type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    WebhookEvent:
      type: object
      required:
        - eventType
        - intentId
      properties:
        eventType:
          type: string
          enum: [payment.succeeded, payment.failed, payment.refunded]
        intentId:
          type: string
        transactionId:
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        metadata:
          type: object

    ReconciliationReport:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            summary:
              type: object
              properties:
                totalCount:
                  type: integer
                totalAmount:
                  type: number
                byStatus:
                  type: object
                byMethod:
                  type: object
            payments:
              type: array
              items:
                type: object

    Error:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
