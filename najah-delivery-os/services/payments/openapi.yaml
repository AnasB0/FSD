openapi: 3.0.3
info:
  title: Najah Delivery - Payments Service API
  description: Payment intent management service supporting Mada, STC Pay, and Cash on Delivery for KSA market
  version: 1.0.0
  contact:
    name: Najah Delivery
    email: support@najahdelivery.sa

servers:
  - url: http://localhost:8082
    description: Development server
  - url: https://api.najahdelivery.sa/payments
    description: Production server

tags:
  - name: Health
    description: Service health check
  - name: Payment Intents
    description: Payment intent management
  - name: Webhooks
    description: Payment provider webhooks
  - name: Reconciliation
    description: Payment reconciliation

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                    example: payments-service
                  mongodb:
                    type: string
                    enum: [connected, disconnected]

  /payments/intents:
    post:
      summary: Create payment intent
      tags: [Payment Intents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - merchantId
                - amount
                - paymentMethod
              properties:
                orderId:
                  type: string
                  description: Order ID
                  example: 507f1f77bcf86cd799439011
                merchantId:
                  type: string
                  description: Merchant ID
                  example: 507f1f77bcf86cd799439012
                amount:
                  type: number
                  minimum: 0
                  description: Payment amount in SAR
                  example: 150.50
                currency:
                  type: string
                  default: SAR
                  example: SAR
                paymentMethod:
                  type: string
                  enum: [mada, stc_pay, cash_on_delivery]
                  example: mada
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Payment intent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/intents/{id}:
    get:
      summary: Get payment intent by ID
      tags: [Payment Intents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payment intent ID
          example: pi_abc123def456
      responses:
        '200':
          description: Payment intent retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/intents/{id}/confirm:
    post:
      summary: Confirm payment intent
      tags: [Payment Intents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payment intent ID
          example: pi_abc123def456
      responses:
        '200':
          description: Payment confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PaymentIntent'
                  processing:
                    type: object
                    properties:
                      success:
                        type: boolean
                      transactionId:
                        type: string
                      providerResponse:
                        type: object
                      processedAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/intents/{id}/cancel:
    post:
      summary: Cancel payment intent
      tags: [Payment Intents]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payment intent ID
          example: pi_abc123def456
      responses:
        '200':
          description: Payment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/webhook:
    post:
      summary: Receive payment provider webhook
      tags: [Webhooks]
      parameters:
        - name: x-payment-signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC SHA-256 signature of request body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: payment.succeeded
                intentId:
                  type: string
                  example: pi_abc123def456
                timestamp:
                  type: string
                  format: date-time
                data:
                  type: object
      responses:
        '200':
          description: Webhook received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Webhook received
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Invalid signature
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/reconcile:
    get:
      summary: Get payment intents for reconciliation
      tags: [Reconciliation]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, succeeded, failed, cancelled]
          description: Filter by payment status
        - name: merchantId
          in: query
          schema:
            type: string
          description: Filter by merchant ID
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Filter from date
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: Filter to date
      responses:
        '200':
          description: Reconciliation data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentIntent'
                  summary:
                    type: object
                    properties:
                      totalCount:
                        type: integer
                        example: 150
                      totalAmount:
                        type: number
                        example: 15750.50
                      byStatus:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          succeeded: 120
                          failed: 20
                          cancelled: 10
                      byPaymentMethod:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          mada: 80
                          stc_pay: 50
                          cash_on_delivery: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaymentIntent:
      type: object
      properties:
        intentId:
          type: string
          example: pi_abc123def456
        orderId:
          type: string
          example: 507f1f77bcf86cd799439011
        merchantId:
          type: string
          example: 507f1f77bcf86cd799439012
        amount:
          type: number
          example: 150.50
        currency:
          type: string
          example: SAR
        paymentMethod:
          type: string
          enum: [mada, stc_pay, cash_on_delivery]
          example: mada
        status:
          type: string
          enum: [pending, processing, succeeded, failed, cancelled]
          example: pending
        metadata:
          type: object
          additionalProperties: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentIntentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PaymentIntent'

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Validation error

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: No token provided

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Payment intent not found

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error: Internal server error
