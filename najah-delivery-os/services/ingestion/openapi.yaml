openapi: 3.0.3
info:
  title: Najah Delivery OS - Ingestion Service API
  description: |
    Webhook ingestion service for receiving and processing merchant order data with HMAC authentication.
    
    ## Authentication
    
    All webhook endpoints require HMAC-SHA256 signature authentication:
    1. Compute signature: `HMAC-SHA256(JSON.stringify(payload), webhookSecret)`
    2. Send signature in `x-merchant-signature` header as hex string
    3. Service verifies signature before processing request
    
    ## Security Features
    
    - HMAC-SHA256 signature verification
    - Rate limiting (100 requests per 15 minutes per IP)
    - Request ID tracking for correlation
    - Comprehensive audit logging
    
  version: 1.0.0
  contact:
    name: Najah Delivery OS Support
    email: support@najahdelivery.com
  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Development server
  - url: https://ingestion.najahdelivery.com
    description: Production server

tags:
  - name: Health
    description: Service health and monitoring endpoints
  - name: Webhooks
    description: Webhook ingestion endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Basic health check
      description: Returns service health status
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: ingestion-service
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Service uptime in seconds

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Returns 200 only if service is ready to handle requests
      operationId: getHealthReady
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      service:
                        type: string
                      database:
                        type: string
                      express_api:
                        type: string
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Returns 200 if service process is alive
      operationId: getHealthLive
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
                  timestamp:
                    type: string
                    format: date-time

  /webhooks/{merchantId}/orders:
    post:
      tags:
        - Webhooks
      summary: Create order via webhook
      description: |
        Receives order creation webhook from merchant with HMAC authentication.
        
        ## Authentication Flow:
        1. Create payload as JSON string: `const payload = JSON.stringify(orderData)`
        2. Compute HMAC: `const signature = crypto.createHmac('sha256', webhookSecret).update(payload).digest('hex')`
        3. Include signature in header: `x-merchant-signature: {signature}`
        
      operationId: createOrderWebhook
      security:
        - HmacAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          description: Unique merchant identifier
          schema:
            type: string
            example: merchant_abc123
        - name: x-merchant-signature
          in: header
          required: true
          description: HMAC-SHA256 signature of request body (64-char hex string)
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
            example: 'a7f8d9e6c4b2a1f3e5d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderWebhookPayload'
            example:
              orderNumber: 'ORD-2024-001'
              items:
                - sku: 'ITEM-001'
                  name: 'Premium Widget'
                  quantity: 2
                  price: 45.99
                  weight: 0.5
              customer:
                name: 'Ahmed Al-Rashid'
                phone: '+966501234567'
                email: 'ahmed@example.com'
              address:
                street: 'King Fahd Road'
                city: 'Riyadh'
                district: 'Al Olaya'
                building: 'Tower 5'
                floor: '12'
                apartment: '1205'
                coordinates:
                  latitude: 24.7136
                  longitude: 46.6753
              timeWindow:
                start: '2024-01-15T09:00:00Z'
                end: '2024-01-15T17:00:00Z'
              notes: 'Please call before delivery'
              priority: 'HIGH'
      responses:
        '201':
          description: Order received and queued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  orderId:
                    type: string
                    example: '1234567890123'
                  webhookLogId:
                    type: string
                    example: '507f1f77bcf86cd799439011'
                  message:
                    type: string
                    example: 'Order received and queued for processing'
                  requestId:
                    type: string
                    example: '123e4567-e89b-12d3-a456-426614174000'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingSignature:
                  value:
                    error: MISSING_SIGNATURE
                    message: x-merchant-signature header is required
                    requestId: '123e4567-e89b-12d3-a456-426614174000'
                invalidSignature:
                  value:
                    error: INVALID_SIGNATURE
                    message: Webhook signature verification failed
                    requestId: '123e4567-e89b-12d3-a456-426614174000'
                    hint: 'Ensure you are using the correct secret and signing the raw JSON payload'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{merchantId}/logs:
    get:
      tags:
        - Webhooks
      summary: Retrieve webhook logs
      description: Get webhook processing logs for debugging and monitoring
      operationId: getWebhookLogs
      security:
        - HmacAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by processing status
          schema:
            type: string
            enum: [SUCCESS, FAILED, PENDING]
        - name: limit
          in: query
          description: Number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Webhook logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookLog'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer

components:
  securitySchemes:
    HmacAuth:
      type: apiKey
      in: header
      name: x-merchant-signature
      description: HMAC-SHA256 signature of request body

  schemas:
    OrderWebhookPayload:
      type: object
      required:
        - orderNumber
        - items
        - customer
        - address
        - timeWindow
      properties:
        orderNumber:
          type: string
          minLength: 1
          maxLength: 100
          description: Merchant order reference number
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - sku
              - name
              - quantity
              - price
            properties:
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
              price:
                type: number
                minimum: 0
              weight:
                type: number
                minimum: 0
              dimensions:
                type: object
                properties:
                  length:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
        customer:
          type: object
          required:
            - name
            - phone
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: string
              format: email
            alternatePhone:
              type: string
        address:
          type: object
          required:
            - street
            - city
          properties:
            street:
              type: string
            city:
              type: string
            district:
              type: string
            building:
              type: string
            floor:
              type: string
            apartment:
              type: string
            landmark:
              type: string
            coordinates:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
        timeWindow:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        notes:
          type: string
          maxLength: 1000
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          default: MEDIUM
        metadata:
          type: object
          description: Additional merchant-specific data

    WebhookLog:
      type: object
      properties:
        _id:
          type: string
        merchantId:
          type: string
        endpoint:
          type: string
        method:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        orderId:
          type: string
        retryCount:
          type: integer
        processingTimeMs:
          type: number
        responseCode:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        requestId:
          type: string

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid webhook payload
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        requestId:
          type: string
